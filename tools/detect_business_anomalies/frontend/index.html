<!doctype html>
<html lang="es-MX">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detect Business Anomalies</title>
<style>:root{color-scheme:dark;--bg:#0E1216;--surface:#161B21;--border:#262D35;--text:#E6E9EC;--muted:#9AA4AE;--info:#4C8FBF;--ok:#3FB36B}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "IBM Plex Sans",Arial,sans-serif}header{border-bottom:1px solid var(--border);background:var(--surface);padding:18px 24px}main{max-width:1152px;margin:auto;padding:24px}h1{font-size:18px;font-weight:500;margin:0 0 6px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}.panel{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:16px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font:24px monospace;margin-top:10px}.ok{color:var(--ok)}code{color:var(--info);font-family:monospace}</style></head>
<body><header><main><h1>Detect Business Anomalies</h1><p>Control Room · ISO 9001:2015 · diagnóstico de variabilidad</p></main></header><main><div class="grid"><section class="panel"><div class="label">Tool ID</div><div class="value">detect_business_anomalies</div></section><section class="panel"><div class="label">Service status</div><div id="status" class="value">Checking...</div></section></div><section class="panel" style="margin-top:12px"><div class="label">Backend contract</div><p>Los handlers viven en <code>src/tools/detect_business_anomalies.js</code> y publican anomalías con severidad y z-score.</p></section></main><script>fetch('/health').then(r=>r.json()).then(x=>{document.getElementById('status').textContent=x.status;document.getElementById('status').className='value ok'}).catch(()=>document.getElementById('status').textContent='Unavailable')</script></body></html>
